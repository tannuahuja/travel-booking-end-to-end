services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelbooking
      POSTGRES_USER: travelapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../app/src/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelapp -d travelbooking"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: travelbooking
      DB_USER: travelapp
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      APP_VERSION: local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    profiles: ["quality"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local-only}
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      sonar-db:
        condition: service_healthy
    networks: [qualitynet]
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    profiles: ["quality"]
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local-only}
    volumes:
      - sonardata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [qualitynet]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [appnet]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana-local-only}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:
  qualitynet:

volumes:
  pgdata:
  sonardata:

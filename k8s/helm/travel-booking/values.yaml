replicaCount: 2
image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/travel-booking-backend
  tag: "replace-with-immutable-git-sha"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3000
containerPort: 3000
database:
  host: postgres
  port: 5432
  name: travelbooking
  user: travelapp
  # Demo only: use External Secrets / AWS Secrets Manager in real environments.
  password: "change-me-before-deploy"
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 2Gi
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
ingress:
  enabled: false
  className: nginx
  host: travel-booking.example.invalid

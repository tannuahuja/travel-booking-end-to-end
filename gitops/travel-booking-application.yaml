apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travel-booking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/travel-booking-devops.git
    targetRevision: main
    path: k8s/helm/travel-booking
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: travel-booking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
